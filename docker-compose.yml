# Optional for now: V1 runs on SQLite. Once Docker Desktop works:
#   docker compose up -d db
# then set DATABASE_URL=postgresql+psycopg://nazar:nazar@localhost:5432/nazar in .env
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nazar
      POSTGRES_PASSWORD: nazar
      POSTGRES_DB: nazar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
