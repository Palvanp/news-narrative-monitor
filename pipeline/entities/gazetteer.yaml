# Canonical entities with English and Hindi surface forms.
#
# Two jobs:
#  1. Canonicalize NER output across languages (अमेरिका, US, America -> United States).
#  2. Find entity types NER models miss: political parties, government bodies and
#     policy terms are matched directly in the text.
#
# Types: PERSON ORG PARTY GOV COUNTRY LOC EVENT POLICY
# `match: true` means the aliases are searched for in text even when NER doesn't tag them.
# Extend this per monitored event.

